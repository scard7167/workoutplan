# Targets, progression rule, thresholds. Single source of truth for prescriptions.

athlete:
  sessions_per_week: 7
  # 7 short strength sessions on top of 30-50 km/week of running and cycling that this
  # log never sees. Recovery is the binding constraint, not gym time, so the routine
  # runs 10-12 working sets per session rather than 20+. See CLAUDE.md hard rules.

# Weekly DIRECT hard-set targets per muscle, rolling 7 days.
# These are DERIVED FROM routine.yaml: the target is what the routine delivers when it
# is executed as written, with min/max as the tolerance either side. Change the routine
# and these move with it - never the other way round.
#
# They are direct-work targets and sit BELOW the numbers the volume literature quotes,
# because indirect stimulus is real but uncounted here: triceps and front delts get
# plenty from pressing, biceps from rowing and pulldowns, glutes from cycling.
#
# quads and calves are UNCOVERED BY DESIGN - no routine lift trains them directly. The
# cycling and running do, and that load is not in this log. Their band is 0 and the
# volume report labels them UNCOVERED rather than RED. Do not "fix" this by adding leg
# work on the basis of this log.
volume_targets:
  chest:        {min: 18, target: 20, max: 24}
  lats:         {min: 12, target: 16, max: 20}
  upper_back:   {min: 2, target: 4, max: 7}
  front_delts:  {min: 6, target: 8, max: 10}
  side_delts:   {min: 14, target: 16, max: 20}
  rear_delts:   {min: 10, target: 12, max: 15}
  biceps:       {min: 15, target: 16, max: 19}
  triceps:      {min: 19, target: 20, max: 23}
  quads:        {min: 6, target: 8, max: 12}
  hamstrings:   {min: 6, target: 8, max: 10}
  glutes:       {min: 14, target: 16, max: 18}
  calves:       {min: 0,  target: 0,  max: 5}
  core:         {min: 7, target: 8, max: 11}

# Muscles no routine lift trains directly. Reported as UNCOVERED, never as a deficit.
# quads came OUT on 2026-09-09: the Wednesday gym80 leg day trains them directly, so
# they are measured like anything else. Calves remain uncovered - nothing in the routine
# trains them and the cycling does.
uncovered_by_design: [calves]

progression:
  # Double progression. This is the ONLY source of load prescriptions.
  #   1. Any working set falls below rep_range floor at RIR 0
  #      -> deload that exercise by deload_pct, rounded DOWN to the increment.
  #      Applies immediately, from the next set onward. Checked first.
  #   2. Every working set of the exercise in the last session hit rep_range ceiling
  #      with RIR <= rir_ceiling -> add one increment, reps reset to rep_range floor.
  #      A blank RIR does not satisfy this.
  #   3. Otherwise hold the load and add reps.
  rule: double_progression
  rir_ceiling: 2          # max RIR on every set to trigger a load increase
  deload_pct: 0.10        # deload size when rule 1 fires
  deload_rounding: down   # round the deloaded load down to the exercise increment

metrics:
  # e1RM = weight_kg * (1 + (reps + rir) / 30). Blank RIR is treated as 1.
  blank_rir_as: 1
  # Hard set = any working set. If RIR is present, only RIR <= hard_set_rir counts.
  hard_set_rir: 3
  # Rolling day windows, not calendar weeks.
  windows: [7, 14]

analysis:
  baseline_weeks: 4       # strength_index baseline = first 4 weeks of an exercise = 100
  trend_weeks: 8          # least-squares e1RM slope window
  stall_sessions: 3       # minimum sessions before an exercise can be judged at all
  stall_trend_weeks: 4    # slope window for stall detection - shorter than trend_weeks,
                          # so a lift that rose for 8w then went flat still gets caught
  stall_days: 21          # no e1RM PR in this many DAYS -> stall flag. Session count is
                          # the wrong unit at 3-4 sessions/week: a flat e1RM between load
                          # increments is normal double progression, not a stall.
  min_trend_points: 4     # fewer session points than this -> no slope, say so
  noisy_r2: 0.3           # a slope below this r2 is reported as noisy, not as a trend
  adherence_window: 14    # days used for planned-vs-logged adherence

balance_bands:
  # Set-count ratios over the rolling 7-day window.
  push_pull:      {min: 0.75, max: 1.35} # chest+front_delts+triceps : lats+upper_back+biceps,
                                          # ~1.04 as routine.yaml is currently written
  quad_hamstring: {min: 0.0, max: 1.5}   # quads : hamstrings - quads uncovered by design
  upper_lower:    {min: 4.0, max: 14.0}  # upper : lower sets - runs high BY DESIGN
