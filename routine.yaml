# The plan. 27 lifts, rotated across 7 short sessions a week.
#
# This is the counterpart to log.csv: the routine says what SHOULD happen, the log
# says what did. Every analytic that talks about adherence compares the two.
#
# Design constraints:
#   - 7 sessions/week alongside 30-50 km of running and cycling. Recovery, not time,
#     was the binding constraint, so sessions were SHORT (10-12 working sets, ~35 min).
#     ON 2026-09-10, AT THE USER'S REQUEST, EVERY LIFT WAS SET TO 4 SETS: the week is now
#     140 working sets, days run 16-28, and the bands in config.yaml were rederived to
#     match (chest 20/wk, triceps 20, biceps 16, glutes 16). That is roughly 50% more
#     than the design this file was written around, and it is a deliberate choice, not
#     drift - but it is the number to revisit first if recovery goes.
#     MONDAY IS THE EXCEPTION at 16 sets: it carries three separate gym80 chest presses
#     (3023N incline, 3121 standing, 3016 seated). Three presses in one plane is a lot
#     of the same pattern, and it is what pushed the chest band from 12 to 15 sets/week.
#     Dropping one of them puts Monday back inside the constraint.
#   - 10 lifts, not 20. A small fixed set is what makes the numbers comparable
#     week over week - every swap resets a baseline.
#   - quads and calves are deliberately NOT in the routine. The cycling and running
#     load them and this log never sees it. Their bands in config.yaml are set to 0
#     and the volume report marks them UNCOVERED, not RED.
#
# Edit this file (or the routine screen in the web app) to make it yours.
# `sets` is the TARGET working sets for that lift on that day. Loads never live here -
# they come from the progression rule, always.

lifts:
  - bench_press
  - pullup
  - chest_supported_row
  - overhead_press
  - lateral_raise
  - face_pull
  - barbell_curl
  - triceps_pushdown
  - romanian_deadlift
  - hanging_leg_raise
  - incline_chest_press_machine
  - standing_chest_press_machine
  - seated_chest_press_machine
  - lat_pulldown_machine
  - shoulder_press_machine
  - standing_lateral_raise_machine
  - biceps_machine
  - horizontal_biceps_machine
  - triceps_machine
  - leg_press_machine
  - leg_extension_machine
  - seated_leg_curl_machine
  - hip_abduction_machine
  - hip_thrust_machine
  - lateral_raise_machine
  - dip_machine
  - overhead_triceps_machine

week:
  mon:
    name: chest + triceps (gym80)
    plan:
      - {exercise: incline_chest_press_machine, sets: 4}
      - {exercise: standing_chest_press_machine, sets: 4}
      - {exercise: seated_chest_press_machine, sets: 4}
      - {exercise: lateral_raise_machine, sets: 4}
      - {exercise: dip_machine, sets: 4}
      - {exercise: overhead_triceps_machine, sets: 4}
  tue:
    # Rebuilt on the gym80 machines, the same way mon was. Where a machine is a direct
    # substitute it REPLACES the free-weight lift rather than joining it - pullup ->
    # 3044, overhead_press -> 3032, barbell_curl -> 3010 - so lats, front_delts and
    # biceps keep exactly their old weekly volume. face_pull stays: none of these five
    # machines trains rear delts. 3099, 3011 and 3098 are genuinely new work here, and
    # they are the only reason any band moved (side_delts +3, triceps +2, biceps +2).
    # pullup, overhead_press and barbell_curl all still appear on other days.
    # 3098 "Bizeps horizontal" sits ALONGSIDE 3010, not instead of it: two biceps
    # machines at different arm angles, 4 biceps sets on the day.
    name: pull + overhead (gym80)
    plan:
      - {exercise: lat_pulldown_machine, sets: 4}
      - {exercise: shoulder_press_machine, sets: 4}
      - {exercise: standing_lateral_raise_machine, sets: 4}
      - {exercise: face_pull, sets: 4}
      - {exercise: biceps_machine, sets: 4}
      - {exercise: horizontal_biceps_machine, sets: 4}
      - {exercise: triceps_machine, sets: 4}
  wed:
    # Was "hinge + core" (RDL, hanging leg raise, lateral raise, chest supported row).
    # Rebuilt as a LEG day on the gym80 machines. This is a deliberate reversal of a
    # design constraint at the top of this file: quads were uncovered BY DESIGN because
    # the cycling and running already load them. They are now trained here, so quads has
    # come out of uncovered_by_design in config.yaml and is measured like any other
    # muscle. Recovery, not gym time, is still the binding constraint.
    # romanian_deadlift, lateral_raise and chest_supported_row all still appear on other
    # days, so no muscle lost its only lift; hanging_leg_raise stays as the core slot.
    name: legs (gym80)
    plan:
      - {exercise: leg_press_machine, sets: 4}
      - {exercise: leg_extension_machine, sets: 4}
      - {exercise: seated_leg_curl_machine, sets: 4}
      - {exercise: hip_thrust_machine, sets: 4}
      - {exercise: hip_abduction_machine, sets: 4}
      - {exercise: hanging_leg_raise, sets: 4}
  thu:
    name: heavy pair
    plan:
      - {exercise: bench_press, sets: 4}
      - {exercise: pullup, sets: 4}
      - {exercise: triceps_pushdown, sets: 4}
      - {exercise: barbell_curl, sets: 4}
  fri:
    name: shoulders
    plan:
      - {exercise: overhead_press, sets: 4}
      - {exercise: lateral_raise, sets: 4}
      - {exercise: face_pull, sets: 4}
      - {exercise: hanging_leg_raise, sets: 4}
  sat:
    name: row + hinge
    plan:
      - {exercise: chest_supported_row, sets: 4}
      - {exercise: romanian_deadlift, sets: 4}
      - {exercise: barbell_curl, sets: 4}
      - {exercise: triceps_pushdown, sets: 4}
  sun:
    name: full
    plan:
      - {exercise: bench_press, sets: 4}
      - {exercise: pullup, sets: 4}
      - {exercise: lateral_raise, sets: 4}
      - {exercise: face_pull, sets: 4}
