# Exercise library. Canonical names are the keys - log.csv never contains free text.
#
# muscles:    PRIME MOVERS ONLY. A set counts 1 hard set to each muscle listed here
#             and nothing to anything else. Indirect stimulus is real but deliberately
#             uncounted - the target bands in config.yaml are set low to compensate.
#             Two entries only where the lift is genuinely co-primary.
# increment:  smallest load jump available for this lift, in kg. For dumbbells this is
#             the per-dumbbell jump (log weight_kg per dumbbell, not the pair).
# rep_range:  [floor, ceiling] for double progression.
# bodyweight: true  -> weight_kg is ADDED load only. Bodyweight-only sets are logged
#             as 0. e1RM is not meaningful for these sets and analytics exclude them
#             from e1RM trends; progress on them is tracked by reps until load is added.
# image:      OPTIONAL. Path to a reference photo, relative to web/ (e.g.
#             images/bench_press.jpg). Purely cosmetic - lets the web app show a small
#             thumbnail next to the exercise so a specific machine is recognisable at a
#             glance; never read by analyze.py or the progression rule. Attaching one to
#             an exercise that already exists is not a library change under the hard
#             rules below - only adding a new exercise entry or touching muscles/
#             increment/rep_range is. web/build_data.py fails loud if the path is
#             declared but the file is missing.
#
# Adding a lift here requires asking first. See CLAUDE.md, hard rules.

bench_press:
  aliases: [bench, bp, bb bench, flat bench]
  muscles: [chest]
  increment: 2.5
  rep_range: [6, 10]

incline_db_press:
  aliases: [incline db, idb, incline press, incline db press, incline]
  muscles: [chest]
  increment: 2
  rep_range: [8, 12]

cable_fly:
  aliases: [fly, flies, flye, cable fly, pec fly, pec deck]
  muscles: [chest]
  increment: 2.5
  rep_range: [10, 15]

dip:
  aliases: [dip, dips, weighted dip]
  muscles: [chest, triceps]
  increment: 2.5
  rep_range: [6, 10]
  bodyweight: true

overhead_press:
  aliases: [ohp, opress, standing press, mil press, military press]
  muscles: [front_delts]
  increment: 2.5
  rep_range: [5, 8]

db_shoulder_press:
  aliases: [db press, shoulder press, db shoulder press, seated db press]
  muscles: [front_delts]
  increment: 2
  rep_range: [8, 12]

lateral_raise:
  aliases: [lat raise, lr, side raise, db lateral, lateral]
  muscles: [side_delts]
  increment: 2
  rep_range: [12, 18]

cable_lateral_raise:
  aliases: [cable lr, cable lat raise, cable lateral, cable side raise]
  muscles: [side_delts]
  increment: 2.5
  rep_range: [12, 18]

reverse_fly:
  aliases: [rear fly, reverse fly, rear delt fly, rev fly, reverse pec deck]
  muscles: [rear_delts]
  increment: 2
  rep_range: [12, 18]

face_pull:
  aliases: [face pull, fp, facepull]
  muscles: [rear_delts]
  increment: 2.5
  rep_range: [12, 20]

pullup:
  aliases: [pullup, pull up, pu, chin, chinup, chin up]
  muscles: [lats]
  increment: 2.5
  rep_range: [5, 10]
  bodyweight: true

lat_pulldown:
  aliases: [pulldown, lpd, lat pulldown, pull down]
  muscles: [lats]
  increment: 2.5
  rep_range: [8, 12]

barbell_row:
  aliases: [row, bb row, barbell row, pendlay]
  muscles: [lats, upper_back]
  increment: 2.5
  rep_range: [6, 10]

chest_supported_row:
  aliases: [csr, chest supported row, seal row, machine row, cable row]
  muscles: [upper_back, lats]
  increment: 2.5
  rep_range: [8, 12]

barbell_curl:
  aliases: [curl, bb curl, barbell curl, ez curl]
  muscles: [biceps]
  increment: 2.5
  rep_range: [8, 12]

incline_db_curl:
  aliases: [incline curl, idc, incline db curl, seated curl]
  muscles: [biceps]
  increment: 2
  rep_range: [10, 14]

triceps_pushdown:
  aliases: [pushdown, pd, tri pushdown, rope pushdown, triceps pushdown]
  muscles: [triceps]
  increment: 2.5
  rep_range: [10, 15]

overhead_triceps_extension:
  aliases: [oh ext, overhead ext, ohe, overhead extension, skull, skullcrusher]
  muscles: [triceps]
  increment: 2.5
  rep_range: [10, 15]

back_squat:
  aliases: [squat, sq, back squat, bb squat]
  muscles: [quads, glutes]
  increment: 5
  rep_range: [5, 8]

romanian_deadlift:
  aliases: [rdl, romanian, romanian deadlift, stiff leg]
  muscles: [hamstrings, glutes]
  increment: 5
  rep_range: [6, 10]

standing_calf_raise:
  aliases: [calf, calf raise, calves, standing calf]
  muscles: [calves]
  increment: 5
  rep_range: [10, 15]

hanging_leg_raise:
  aliases: [leg raise, hlr, hanging leg raise, knee raise]
  muscles: [core]
  increment: 2.5
  rep_range: [10, 15]
  bodyweight: true

cable_crunch:
  aliases: [cable crunch, crunch, kneeling crunch]
  muscles: [core]
  increment: 2.5
  rep_range: [10, 15]

incline_chest_press_machine:
  # gym80 Sygnum 3023N "Schragbank" - plate-stack incline press, NOT incline_db_press:
  # that's per-dumbbell, this is total stack weight. Different unit, different lift.
  aliases: [gym80 3023n, schragbank, sygnum incline press, incline chest machine,
            incline machine press]
  muscles: [chest]
  increment: 5   # UNVERIFIED - Sygnum stack increment assumed at the commercial-machine
                 # default. Read the actual plate/pin spacing off the machine and correct
                 # this before trusting a prescribed load on it.
  rep_range: [8, 12]
  image: images/incline_chest_press_machine.jpg

standing_chest_press_machine:
  # gym80 Sygnum 3121 "Brustmaschine stehend" - standing plate-stack chest press.
  aliases: [gym80 3121, brustmaschine stehend, standing chest press, standing chest
            machine, standing chest press machine]
  muscles: [chest]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [8, 12]
  image: images/standing_chest_press_machine.jpg

seated_chest_press_machine:
  # gym80 Sygnum 3016 "Brustpresse" - seated plate-stack chest press. A THIRD chest
  # machine alongside 3023N (incline) and 3121 (standing): same muscle, same total-stack
  # unit, but a distinct machine, so it gets its own baseline rather than an alias.
  aliases: [gym80 3016, brustpresse, sygnum 3016, seated chest press, chest press
            machine, seated chest press machine]
  muscles: [chest]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine. NOT legible on the
                 # product page - this is the assumed commercial default, not a reading.
  rep_range: [8, 12]
  image: images/seated_chest_press_machine.jpg

lat_pulldown_machine:
  # gym80 Sygnum Dual 3044 "Ruckenzugmaschine Dual" - plate-stack pulldown, independent
  # arms. NOT lat_pulldown: that is the cable station, this is a total-stack machine with
  # its own load curve, so it gets its own baseline. The product copy says "breite
  # Ruckenmuskulatur" (lats), so lats is the single prime mover - if it turns out to be a
  # row rather than a pulldown, upper_back belongs here as co-primary.
  aliases: [gym80 3044, rueckenzugmaschine dual, ruckenzugmaschine dual,
            back pull machine dual, lat pulldown machine, dual pulldown]
  muscles: [lats]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [8, 12]
  image: images/lat_pulldown_machine.jpg

shoulder_press_machine:
  # gym80 Sygnum 3032 "Schulterpresse" - seated plate-stack shoulder press.
  aliases: [gym80 3032, schulterpresse, shoulder press machine, machine shoulder press]
  muscles: [front_delts]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [8, 12]
  image: images/shoulder_press_machine.jpg

standing_lateral_raise_machine:
  # gym80 Sygnum 3099 "Seithebemaschine stehend" - the STANDING lateral raise machine,
  # a different machine from 3050 (seated) and loaded differently. Separate entry.
  aliases: [gym80 3099, seithebemaschine stehend, standing lateral raise, standing side
            raise, standing lateral raise machine]
  muscles: [side_delts]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [12, 18]
  image: images/standing_lateral_raise_machine.jpg

biceps_machine:
  # gym80 Sygnum 3010 "Bizepsmaschine" - "Isoliertes Training des Bizeps", so biceps is
  # the only prime mover.
  aliases: [gym80 3010, bizepsmaschine, biceps machine, machine curl]
  muscles: [biceps]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [10, 14]
  image: images/biceps_machine.jpg

horizontal_biceps_machine:
  # gym80 Sygnum 3098 "Bizeps horizontal" - "Isoliertes Training des Bizeps", so biceps
  # is the only prime mover. A SECOND biceps machine alongside 3010: different arm angle
  # and a different stack, so a separate baseline rather than an alias onto it.
  aliases: [gym80 3098, bizeps horizontal, biceps horizontal, horizontal biceps,
            horizontal biceps machine]
  muscles: [biceps]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [10, 14]
  image: images/horizontal_biceps_machine.jpg

triceps_machine:
  # gym80 Sygnum 3011 "Trizepsmaschine" - "Isoliertes Training des Trizeps". Seated, not
  # the overhead 3095: different machine, different baseline.
  aliases: [gym80 3011, trizepsmaschine, triceps machine, seated triceps machine]
  muscles: [triceps]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [10, 15]
  image: images/triceps_machine.jpg

leg_press_machine:
  # gym80 Sygnum 3031 "Beinpresse liegend" - lying plate-stack leg press. The product
  # copy names "Oberschenkelmuskulatur und Gluteus", so quads and glutes are co-primary,
  # exactly as back_squat is.
  aliases: [gym80 3030, gym80 3031, beinpresse sitzend, beinpresse, leg press,
            leg press machine, seated leg press]
  muscles: [quads, glutes]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [8, 12]
  image: images/leg_press_machine.jpg

leg_extension_machine:
  # gym80 Sygnum Combo 5013 "Beinbeuger und Beinstrecker Combo". The machine does BOTH
  # movements, but one canonical name cannot carry both: a knee extension and a knee
  # flexion are different lifts and averaging their loads into one e1RM series is
  # meaningless. This entry is the EXTENSION half only. If the curl half of 5013 gets
  # used rather than 3003, that is a different stack again and needs its own entry - ask.
  aliases: [gym80 3001, gym80 5013, beinstrecker, leg extension, knee extension,
            leg extension machine]
  muscles: [quads]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [10, 15]
  image: images/leg_extension_machine.jpg

seated_leg_curl_machine:
  # gym80 Sygnum 3003 "Beinbeuger sitzend" - seated plate-stack leg curl. Dedicated
  # machine, so it carries the hamstring work rather than 5013's curl half.
  aliases: [gym80 3003, beinbeuger sitzend, beinbeuger, seated leg curl, leg curl,
            leg curl machine]
  muscles: [hamstrings]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [10, 15]
  image: images/seated_leg_curl_machine.jpg

hip_abduction_machine:
  # gym80 Sygnum Combo 5011 "Abduktion und Adduktion Combo". Credited to glutes for the
  # ABDUCTION half (gluteus medius). The adduction half trains the adductors, which are
  # not a group in this log's taxonomy - that work is real but uncounted, the same way
  # indirect work is. Do not invent an `adductors` group to fix this; raise it instead.
  aliases: [gym80 5011, abduktion und adduktion, abduktion, adduktion, hip abduction,
            abduction machine, hip abduction machine]
  muscles: [glutes]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [12, 18]
  image: images/hip_abduction_machine.jpg

hip_thrust_machine:
  # gym80 Sygnum 4416 "Bootymizer" - plate-stack hip thrust. "Training der
  # Gesaessmuskulatur", so glutes only.
  aliases: [gym80 4416, bootymizer, hip thrust, hip thrust machine, glute machine]
  muscles: [glutes]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [8, 12]
  image: images/hip_thrust_machine.jpg

lateral_raise_machine:
  # gym80 Sygnum 3050 "Seithebemaschine" - plate-stack lateral raise, independent arms.
  # Not the same unit as lateral_raise (DB) or cable_lateral_raise.
  aliases: [gym80 3050, seithebemaschine, side raise machine, lateral raise machine,
            machine lateral raise]
  muscles: [side_delts]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [12, 18]
  image: images/lateral_raise_machine.jpg

dip_machine:
  # gym80 Sygnum 3036 "Dipmaschine" - plate-stack dip press. The product page credits
  # this to triceps only ("Training des Trizeps"), unlike the bodyweight `dip` entry
  # (chest+triceps) - trust what the machine states, don't assume co-primary chest.
  aliases: [gym80 3036, dipmaschine, dip machine, machine dip, triceps dip machine]
  muscles: [triceps]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [10, 15]
  image: images/dip_machine.jpg

overhead_triceps_machine:
  # gym80 Sygnum 3095 "Trizeps Uberkopf" - plate-stack overhead extension. Not the same
  # unit as overhead_triceps_extension (its "skullcrusher" alias is free-weight/EZ-bar).
  aliases: [gym80 3095, trizeps uberkopf, "trizeps \u00fcberkopf", overhead triceps
            machine, triceps overhead machine]
  muscles: [triceps]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [10, 15]
  image: images/overhead_triceps_machine.jpg

rowing_machine:
  # gym80 Sygnum Dual 3045 "Rudermaschine Dual" - plate-stack seated row, unilateral
  # capable, adjustable chest pad, rotating handles. TWO prime movers, same as the
  # `chest_supported_row` entry: a horizontal row is genuinely co-primary upper back and
  # lats, which is one of the four cases CLAUDE.md allows a second muscle for.
  aliases: [gym80 3045, rudermaschine dual, rudermaschine, rowing machine, machine row
            dual, sygnum dual row]
  muscles: [upper_back, lats]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [8, 12]
  image: images/rowing_machine.jpg

pullover_machine:
  # gym80 Sygnum 3012N "Uberzugmaschine" - plate-stack pullover, 7-position seat pad.
  # The product page credits it to back musculature; a pullover's prime mover is the lat.
  # NOT co-primary chest: indirect pec work here is real but uncounted, same rule as
  # triceps on a press.
  aliases: [gym80 3012n, gym80 3012, uberzugmaschine, "überzugmaschine", pullover
            machine, pullover, machine pullover]
  muscles: [lats]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [10, 14]
  image: images/pullover_machine.jpg

reverse_fly_machine:
  # gym80 Sygnum 3025 "Butterfly Reverse" - plate-stack reverse pec deck, two grip
  # options, chest pad. Distinct unit from the free-weight `reverse_fly` entry and
  # credited the same way it is: rear delts only. The page also names upper back, but
  # `reverse_fly` has been rear_delts alone since the start and splitting the credit on
  # one of the pair and not the other would make their volume incomparable.
  aliases: [gym80 3025, butterfly reverse, reverse butterfly, reverse fly machine,
            reverse pec deck machine, rear delt machine]
  muscles: [rear_delts]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [12, 18]
  image: images/reverse_fly_machine.jpg

back_pull_machine:
  # gym80 Sygnum 3020 "Ruckenzugmaschine" - plate-stack vertical pull with variable grips
  # and a stabilisation element. Separate unit from `lat_pulldown_machine`; the page
  # credits it to the broad back musculature, so lats.
  aliases: [gym80 3020, ruckenzugmaschine, "rückenzugmaschine", back pull machine,
            back pull, ruckenzug]
  muscles: [lats]
  increment: 5   # UNVERIFIED, see incline_chest_press_machine
  rep_range: [8, 12]
  image: images/back_pull_machine.jpg
