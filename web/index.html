<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#161826">
<meta name="description" content="Strength Log - log the sets, see whether you are actually getting stronger, edit next week's plan with the volume consequences in place.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strength Log">
<title>Strength Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header>
    <div class="hrow">
      <span class="mark" aria-hidden="true"></span>
      <span class="brand">Strength Log</span>
      <span class="hmeta" id="hmeta"></span>
    </div>
    <nav role="tablist" aria-label="sections">
      <button role="tab" data-tab="Session"  aria-selected="true">Session</button>
      <button role="tab" data-tab="Cardio"   aria-selected="false">Cardio</button>
      <button role="tab" data-tab="Progress" aria-selected="false">Progress</button>
      <button role="tab" data-tab="Plan"     aria-selected="false">Plan</button>
      <button role="tab" data-tab="History"  aria-selected="false">History</button>
    </nav>
    <div class="rule"></div>
  </header>

  <main id="main">
    <section class="panel" id="p-Session"  role="tabpanel"></section>
    <section class="panel" id="p-Cardio"   role="tabpanel" hidden></section>
    <section class="panel" id="p-Progress" role="tabpanel" hidden></section>
    <section class="panel" id="p-Plan"     role="tabpanel" hidden></section>
    <section class="panel" id="p-History"  role="tabpanel" hidden></section>
  </main>

  <!-- overlays: bottom sheets and full-screen covers, rendered on demand -->
  <div id="overlay"></div>

</div>
<script type="module" src="app.js"></script>
</body>
</html>
